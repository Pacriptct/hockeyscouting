# Wittenberg Hockey recruiting scout config
#
# Every source below gets pulled on the daily run. Turn a source off with
# `enabled: false`. A source that fails gets logged and skipped, so one broken
# site never kills the whole run.

program:
  name: Wittenberg University Men's Hockey
  level: ACHA D2 (moving to NCAA D3)
  coach_name: "Dylan McLean"   # who the DMs/emails are from ({me} in templates)
  coach_email: ""
  coach_phone: ""

# "auto" means the current season from today's date (Aug+ = new season).
season: auto

# Birth years we're recruiting, with how much each one counts (0-1).
# Junior players have to be 20 or younger on Dec 31, so for 2026-27 the
# oldest juniors are 2006s - their last year, they need a home next fall.
# Bump every year by one each summer.
birth_years:
  2006: 1.0
  2007: 1.0
  2008: 0.85
  2009: 0.6
  2010: 0.3

# Anyone with a college commitment gets dropped, unless the commitment
# mentions one of these (ACHA commits can still be flipped).
keep_if_committed_to:
  - ACHA

min_games: 5        # need this many GP before we trust the numbers
max_results: 10000  # cap on prospects kept in the dashboard
digest_size: 40     # how many new guys go in the daily email

# How strong each level is. Production is ranked against the player's own
# league, then multiplied by this.
level_weights:
  "Tier I": 1.0
  "Tier II": 0.95
  "Canadian Jr A": 0.9
  "Tier III": 0.7
  "Prep": 0.7
  "18U AAA": 0.65
  "Tier III Dev": 0.5
  "Other": 0.5

# Every league we pull from. Each one points at the league's own stats page.
#
#   url        the league's skater stats page (or a list of pages, e.g. one
#              per division). Blank = shows as "Needs URL" on the Sources tab.
#   goalie_url separate goalie stats page, if the site splits them
#   render     true = load it in a real browser first. Needed for most league
#              sites since the stats are filled in by JavaScript. Leave on.
#
# To find a URL: go to the league's website, open the full player stats
# (not just top 10 leaders), copy the address. Then test it with the
# "Probe a stats page" action on GitHub before adding it here. Stats URLs on
# SportsEngine / GameSheet sites change every season, so expect to update
# them each fall. NAHL / NA3HL have season_id in the URL: grab the new one
# from their stats page when the season changes.
sources:

  # ---------------------------------------------------------------- Tier I
  - name: USHL
    type: league_site
    league: USHL
    level: Tier I
    url: ""
    render: true
    enabled: false

  # ---------------------------------------------------------------- Tier II
  - name: EHL
    type: league_site
    league: EHL
    level: Tier II
    url: "https://gamesheetstats.com/seasons/15125/players"  # EHL embeds GameSheet; season id changes yearly
    goalie_url: "https://gamesheetstats.com/seasons/15125/goalies"
    render: true
    enabled: true
  - name: NAHL
    type: league_site
    league: NAHL
    level: Tier II
    url: "https://nahl.com/skater-stats/?league_id=4&season_id=15192&stat_class=&team_id=all-teams&club_id_m="
    goalie_url: "https://nahl.com/goalie-stats/?league_id=4&season_id=15192&stat_class=&team_id=all-teams&club_id_m="
    render: true
    enabled: true
  - name: USPHL NCDC
    type: league_site
    league: USPHL NCDC
    level: Tier II
    url: "https://usphl.com/ncdc/game-center/skater-goalies/?tab=0&sortColumn=points&sortAsc=false"
    render: true
    enabled: true

  # ---------------------------------------------------------------- Tier III
